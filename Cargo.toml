[package]
name = "cprogress"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A macOS cp with a wget-style progress bar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/petethered/cprogress"
homepage = "https://github.com/petethered/cprogress"
keywords = ["cp", "copy", "progress", "cli", "macos"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[profile.release]
opt-level = 3
